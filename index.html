            const [expandedCategories, setExpandedCategories] = useState([]);

            // 查詢與修改訂單的狀態
            const [showSearchModal, setShowSearchModal] = useState(false);
            const [searchName, setSearchName] = useState('');
            const [isSearching, setIsSearching] = useState(false);
            const [searchResult, setSearchResult] = useState(null);
            const [currentOrderId, setCurrentOrderId] = useState(null);

            // 篩選器狀態
            const [selectedRoast, setSelectedRoast] = useState('');
            const [selectedProcess, setSelectedProcess] = useState('');

            // 取得所有不重複的焙度
            const allRoasts = useMemo(() => {
                const roasts = new Set();
                defaultMenuData.forEach(cat => cat.items.forEach(item => {
                    if (item.roast) roasts.add(item.roast);
                }));
                return Array.from(roasts);
            }, []);

            // 取得所有不重複的處理法
            const allProcesses = useMemo(() => {
                const processes = new Set();
                defaultMenuData.forEach(cat => cat.items.forEach(item => {
                    if (item.process) processes.add(item.process);
                }));
                return Array.from(processes);
            }, []);

            useEffect(() => {
                lucide.createIcons();
            });

            // 預設展開全部分類
            useEffect(() => {
                setExpandedCategories(menuData.map((_, i) => i));
            }, [menuData]);

            // 查詢訂單
            const searchOrder = async () => {
                if (!searchName.trim()) {
                    alert('請輸入名稱');
                    return;
                }
                if (!GAS_URL.startsWith('http')) {
                    alert('系統尚未設定好 API 網址，請聯絡管理員設定。');
                    return;
                }

                setIsSearching(true);
                setSearchResult(null);
                try {
                    const response = await fetch(`${GAS_URL}?action=searchOrder&name=${encodeURIComponent(searchName.trim())}`);
                    const result = await response.json();

                    if (result.status === 'success') {
                        setSearchResult(result.order);
                    } else {
                        setSearchResult({ error: '找不到該名稱的訂單，請確認輸入是否正確。' });
                    }
                } catch (error) {
                    setSearchResult({ error: '連線失敗，請稍後再試。' });
                } finally {
                    setIsSearching(false);
                }
            };

            // 載入舊訂單
            const loadOrderForEdit = () => {
                if (searchResult && searchResult.rawData) {
                    setCart(searchResult.rawData.cart);
                    setBuyerName(searchResult.rawData.buyerName || searchResult.name); // 容錯舊資料
                    setCurrentOrderId(searchResult.orderId);
                    setShowSearchModal(false);
                    setSubmitMessage({ type: 'success', text: `已成功載入您的訂單！修改完成後請點擊下方「確認修改」。` });
                }
            };

            const cancelEdit = () => {
                setCurrentOrderId(null);
                setCart([]);
                setBuyerName('');
                setSubmitMessage(null);
            };

            const addToCart = (item, type, price) => {
                const cartKey = `${item.id}-${type}`;
                const namePrefix = type === 'bean' ? '[咖啡豆] ' : type === 'drip' ? '[掛耳包] ' : '';
                const weightSuffix = (type === 'bean' && item.weight) ? ` (${item.weight})` : '';

                setCart(prev => {
                    const existing = prev.find(c => c.cartKey === cartKey);
                    if (existing) {
                        return prev.map(c => c.cartKey === cartKey ? { ...c, qty: c.qty + 1 } : c);
                    }
                    return [...prev, {
                        cartKey,
                        id: item.id,
                        name: `${namePrefix}${item.name}${weightSuffix}`,
                        type,
                        price,
                        qty: 1,
                        isPremium: item.isPremium || false,
                        isClassic: item.isClassic || false
                    }];
                });
            };

            const updateQty = (cartKey, delta) => {
                setCart(prev => prev.map(c => {
                    if (c.cartKey === cartKey) {
                        const newQty = c.qty + delta;
                        return newQty > 0 ? { ...c, qty: newQty } : c;
                    }
                    return c;
                }));
            };

            const removeItem = (cartKey) => {
                setCart(prev => prev.filter(c => c.cartKey !== cartKey));
            };

            const orderSummary = useMemo(() => {
                let subtotal = 0;
                let premiumBeanQty = 0;
                let classicBeanQty = 0;

                cart.forEach(item => {
                    subtotal += item.price * item.qty;
                    if (item.type === 'bean') {
                        if (item.isPremium) premiumBeanQty += item.qty;
                        if (item.isClassic) classicBeanQty += item.qty;
                    }
                });

                const premiumDiscount = Math.floor(premiumBeanQty / 3) * 200;
                const classicDiscount = Math.floor(classicBeanQty / 3) * 150;
                const totalDiscount = premiumDiscount + classicDiscount;
                const finalTotal = subtotal - totalDiscount;

                return { subtotal, premiumDiscount, classicDiscount, totalDiscount, finalTotal };
            }, [cart]);

            const toggleCategory = (index) => {
                setExpandedCategories(prev =>
                    prev.includes(index) ? prev.filter(i => i !== index) : [...prev, index]
                );
            };

            const submitOrder = async () => {
                if (!buyerName.trim()) {
                    setSubmitMessage({ type: 'error', text: '請輸入您的暱稱或代號！' });
                    return;
                }
                if (cart.length === 0) {
                    setSubmitMessage({ type: 'error', text: '購物車內沒有商品！' });
                    return;
                }

                setIsSubmitting(true);
                setSubmitMessage(null);

                const payload = {
                    action: currentOrderId ? 'update' : 'create',
                    orderId: currentOrderId,
                    orderDate: new Date().toLocaleDateString('zh-TW') + ' ' + new Date().toLocaleTimeString('zh-TW'),
                    buyerName: buyerName.trim(),
                    cartText: cart.map(c => `${c.name} x${c.qty} ($${c.price * c.qty})`).join('\n'),
                    subtotal: orderSummary.subtotal,
                    discount: orderSummary.totalDiscount,
                    total: orderSummary.finalTotal,
                    rawData: { cart, buyerName: buyerName.trim() }
                };

                if (!GAS_URL.startsWith('http')) {
                    setTimeout(() => {
                        setIsSubmitting(false);
                        setSubmitMessage({ type: 'success', text: currentOrderId ? '訂單修改成功！（測試模式，未連接 API）' : '訂單已送出！（測試模式，未連接 API）' });
                        if (!currentOrderId) setCart([]);
                        setCurrentOrderId(null);
                    }, 1500);
                    return;
                }

                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setIsSubmitting(false);
                    setSubmitMessage({ type: 'success', text: currentOrderId ? '🎉 訂單已成功修改！' : '🎉 訂單已成功送出！' });
                    setCart([]);
                    setBuyerName('');
                    setCurrentOrderId(null);
                } catch (error) {
                    setIsSubmitting(false);
                    setSubmitMessage({ type: 'error', text: '送出失敗，請檢查網路。' });
                }
            };

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-amber-900 text-amber-50 py-6 px-4 shadow-md sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl md:text-3xl font-bold flex items-center gap-2">
                                    <i data-lucide="coffee" className="text-amber-300 w-8 h-8"></i>
                                    花兒的5號玫瑰園
                                </h1>
                            </div>
                            <button
                                onClick={() => setShowSearchModal(true)}
                                className="px-3 py-2 bg-amber-800 rounded text-sm hover:bg-amber-700 transition flex items-center gap-1"
                            >
                                <i data-lucide="search" className="w-4 h-4"></i>
                                <span className="hidden sm:inline">找回訂單</span>
                            </button>
                        </div>
                    </header>

                    {showSearchModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                                <div className="bg-amber-700 p-4 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-lg flex items-center gap-2"><i data-lucide="search" className="w-5 h-5"></i> 找回/修改訂單</h3>
                                    <button onClick={() => setShowSearchModal(false)} className="hover:text-amber-200"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-stone-700 mb-2">輸入您下單時填寫的名稱/代號</label>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={searchName}
                                                onChange={(e) => setSearchName(e.target.value)}
                                                placeholder="例如: 小王"
                                                className="flex-1 border rounded p-2 focus:outline-amber-500 bg-stone-50"
                                            />
                                            <button
                                                onClick={searchOrder}
                                                disabled={isSearching}
                                                className="bg-stone-800 text-white px-4 py-2 rounded hover:bg-stone-900 transition flex items-center disabled:opacity-50"
                                            >
                                                {isSearching ? '尋找中...' : '查詢'}
                                            </button>
                                        </div>
                                    </div>

                                    {searchResult && (
                                        <div className="mt-4 p-4 border rounded-lg bg-stone-50">
                                            {searchResult.error ? (
                                                <div className="text-red-600 text-sm">{searchResult.error}</div>
                                            ) : (
                                                <div className="space-y-2">
                                                    <div className="flex justify-between border-b pb-2">
                                                        <span className="text-stone-500 text-sm">名稱</span>
                                                        <span className="font-bold text-stone-800">{searchResult.name}</span>
                                                    </div>
                                                    <div className="flex justify-between border-b pb-2">
                                                        <span className="text-stone-500 text-sm">更新時間</span>
                                                        <span className="text-sm text-stone-700">{searchResult.time}</span>
                                                    </div>
                                                    <div className="flex justify-between border-b pb-2">
                                                        <span className="text-stone-500 text-sm">總金額</span>
                                                        <span className="font-bold text-amber-700">${searchResult.total}</span>
                                                    </div>
                                                    <button
                                                        onClick={loadOrderForEdit}
                                                        className="w-full mt-4 bg-amber-600 text-white py-2 rounded font-bold hover:bg-amber-700 transition"
                                                    >
                                                        載入並修改
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-6xl mx-auto mt-6 px-4 flex flex-col lg:flex-row gap-8">

                        {/* 左側：產品列表 */}
                        <div className="flex-1 space-y-6">
                            <div className="bg-orange-100 border-l-4 border-orange-500 p-4 rounded shadow-sm">
                                <h3 className="font-bold text-orange-800 text-lg mb-2">🎉 優惠資訊</h3>
                                <ul className="list-disc pl-5 text-orange-900 space-y-1 text-sm md:text-base">
                                    <li>一般款咖啡豆<strong className="text-red-600">任選三包折扣 200 元</strong>。</li>
                                    <li>經典系列(藍山/曼巴等)咖啡豆<strong className="text-red-600">半磅裝 3 包 600 元</strong>。</li>
                                </ul>
                            </div>

                            {/* 篩選器 */}
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex flex-wrap gap-4 items-center">
                                <span className="font-bold text-stone-700 flex items-center gap-1">
                                    <i data-lucide="filter" className="w-4 h-4"></i> 篩選：
                                </span>
                                <select
                                    value={selectedRoast}
                                    onChange={(e) => setSelectedRoast(e.target.value)}
                                    className="border border-stone-300 rounded p-1.5 text-sm focus:outline-amber-500 bg-stone-50"
                                >
                                    <option value="">所有焙度</option>
                                    {allRoasts.map(r => <option key={r} value={r}>{r}</option>)}
                                </select>
                                <select
                                    value={selectedProcess}
                                    onChange={(e) => setSelectedProcess(e.target.value)}
                                    className="border border-stone-300 rounded p-1.5 text-sm focus:outline-amber-500 bg-stone-50"
                                >
                                    <option value="">所有處理法</option>
                                    {allProcesses.map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                                {(selectedRoast || selectedProcess) && (
                                    <button
                                        onClick={() => { setSelectedRoast(''); setSelectedProcess(''); }}
                                        className="text-sm text-stone-500 hover:text-red-500 underline"
                                    >
                                        清除篩選
                                    </button>
                                )}
                            </div>

                            {menuData.map((category, idx) => {
                                // 根據篩選器過濾品項
                                const filteredItems = category.items.filter(item => {
                                    const matchRoast = selectedRoast ? item.roast === selectedRoast : true;
                                    const matchProcess = selectedProcess ? item.process === selectedProcess : true;
                                    return matchRoast && matchProcess;
                                });

                                // 如果該分類沒有符合的品項，就不顯示該分類
                                if (filteredItems.length === 0) return null;

                                return (
                                    <div key={idx} className="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
                                        <button
                                            onClick={() => toggleCategory(idx)}
                                            className="w-full bg-stone-100 p-4 flex justify-between items-center hover:bg-stone-200 transition-colors"
                                        >
                                            <h2 className="text-xl font-bold text-stone-800 border-l-4 border-amber-700 pl-3">
                                                {category.category}
                                            </h2>
                                            <i data-lucide={expandedCategories.includes(idx) ? "chevron-up" : "chevron-down"} className="text-stone-500 w-5 h-5"></i>
                                        </button>

                                        {expandedCategories.includes(idx) && (
                                            <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {filteredItems.map(item => (
                                                    <div key={item.id} className="border border-stone-100 bg-stone-50 p-4 rounded-lg flex flex-col justify-between hover:shadow-md transition">
                                                        <div>
                                                            <div className="font-bold text-lg text-stone-900 mb-1">{item.name}</div>
                                                            <div className="flex flex-wrap gap-2 mb-3">
                                                                {item.roast && <span className="text-xs font-bold text-orange-800 bg-orange-200 px-2 py-1 rounded">焙度: {item.roast}</span>}
                                                                {item.process && <span className="text-xs font-bold text-emerald-800 bg-emerald-200 px-2 py-1 rounded">處理法: {item.process}</span>}
                                                                {item.weight && <span className="text-xs font-bold text-amber-800 bg-amber-200 px-2 py-1 rounded">重量: {item.weight}</span>}
                                                                {item.notes && <span className="text-xs text-stone-600 bg-stone-200 px-2 py-1 rounded">{item.notes}</span>}
                                                            </div>
                                                        </div>
                                                        <div className="flex flex-wrap gap-2 mt-auto pt-3 border-t border-stone-200">
                                                            {item.beanPrice && (
                                                                <button onClick={() => addToCart(item, 'bean', item.beanPrice)} className="flex-1 min-w-[120px] bg-amber-400 text-white py-2 px-3 rounded hover:bg-amber-500 active:bg-amber-800 transform active:scale-90 transition-all shadow-sm hover:shadow-md flex items-center justify-center gap-1 text-sm font-medium">
                                                                    <i data-lucide="plus" className="w-4 h-4"></i> {item.isClassic ? '半磅豆' : '咖啡豆'} ${item.beanPrice}
                                                                </button>
                                                            )}
                                                            {item.dripPrice && (
                                                                <button onClick={() => addToCart(item, 'drip', item.dripPrice)} className="flex-1 min-w-[120px] bg-orange-400 text-white py-2 px-3 rounded hover:bg-orange-500 active:bg-orange-800 transform active:scale-90 transition-all shadow-sm hover:shadow-md flex items-center justify-center gap-1 text-sm font-medium">
                                                                    <i data-lucide="plus" className="w-4 h-4"></i> 掛耳包 ${item.dripPrice}
                                                                </button>
                                                            )}
                                                            {item.price && !item.beanPrice && !item.dripPrice && (
                                                                <button onClick={() => addToCart(item, item.type || 'other', item.price)} className="flex-1 w-full bg-amber-500 text-white py-2 px-3 rounded hover:bg-amber-600 active:bg-amber-800 transform active:scale-95 transition-all shadow-sm hover:shadow-md flex items-center justify-center gap-1 text-sm font-medium">
                                                                    <i data-lucide="plus" className="w-4 h-4"></i> 加入購物車 ${item.price}
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* 右側：購物車 */}
                        <div className="lg:w-[400px] xl:w-[350px]">
                            <div className="bg-white rounded-xl shadow-lg border border-stone-200 p-5 sticky top-24">
                                {currentOrderId && (
                                    <div className="mb-4 p-3 bg-amber-100 border border-amber-300 rounded-lg flex justify-between items-center shadow-inner">
                                        <div>
                                            <span className="text-xs font-bold text-red-600 block mb-1">編輯模式</span>
                                            <span className="text-sm font-bold text-amber-900">正在修改訂單</span>
                                        </div>
                                        <button onClick={cancelEdit} className="text-xs font-bold bg-white border border-amber-400 hover:bg-amber-50 text-amber-900 px-3 py-1.5 rounded transition">
                                            取消
                                        </button>
                                    </div>
                                )}

                                <h2 className="text-xl font-bold flex items-center gap-2 border-b pb-3 mb-4 text-stone-800">
                                    <i data-lucide="shopping-cart" className="text-amber-700 w-5 h-5"></i>
                                    購物車
                                </h2>

                                <div className="max-h-[40vh] overflow-y-auto pr-2 space-y-3 mb-4">
                                    {cart.length === 0 ? (
                                        <div className="text-stone-400 text-center py-8">購物車是空的</div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.cartKey} className="flex justify-between items-center bg-stone-50 p-2 rounded border border-stone-100">
                                                <div className="flex-1 pr-2">
                                                    <div className="text-sm font-bold text-stone-800 line-clamp-2">{item.name}</div>
                                                    <div className="text-amber-700 font-medium">${item.price}</div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => updateQty(item.cartKey, -1)} className="p-1 bg-stone-200 rounded hover:bg-stone-300"><i data-lucide="minus" className="w-3 h-3"></i></button>
                                                    <span className="w-6 text-center font-bold">{item.qty}</span>
                                                    <button onClick={() => updateQty(item.cartKey, 1)} className="p-1 bg-stone-200 rounded hover:bg-stone-300"><i data-lucide="plus" className="w-3 h-3"></i></button>
                                                    <button onClick={() => removeItem(item.cartKey)} className="p-1 text-red-400 hover:text-red-600 ml-1"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* 極簡填寫區 */}
                                <div className="border-t border-stone-200 pt-4 mb-4">
                                    <label className="block text-sm font-bold text-stone-700 mb-1">您的名稱或代號 <span className="text-red-500">*</span></label>
                                    <input
                                        type="text"
                                        value={buyerName}
                                        onChange={(e) => setBuyerName(e.target.value)}
                                        placeholder="例如: 小ㄐ、布丁狗"
                                        className="w-full border rounded p-2 bg-stone-50 focus:bg-white focus:outline-amber-500"
                                        required
                                    />
                                    <div className="text-xs text-stone-500 mt-1">日後可憑此名稱查詢修改訂單</div>
                                </div>

                                <div className="bg-stone-100 p-4 rounded-lg space-y-2 text-sm mb-4">
                                    <div className="flex justify-between text-stone-600"><span>小計</span><span>${orderSummary.subtotal}</span></div>
                                    {orderSummary.premiumDiscount > 0 && <div className="flex justify-between text-red-600 font-medium"><span>任選 3 包折扣</span><span>-${orderSummary.premiumDiscount}</span></div>}
                                    {orderSummary.classicDiscount > 0 && <div className="flex justify-between text-red-600 font-medium"><span>經典豆 3 包折扣</span><span>-${orderSummary.classicDiscount}</span></div>}
                                    <div className="border-t border-stone-300 pt-2 mt-2 flex justify-between items-center font-bold text-lg text-stone-900"><span>總計</span><span className="text-amber-700 text-2xl">${orderSummary.finalTotal}</span></div>
                                </div>

                                {submitMessage && (
                                    <div className={`p-3 rounded mb-4 text-sm flex items-start gap-2 ${submitMessage.type === 'success' ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300'}`}>
                                        {submitMessage.type === 'success' ? <i data-lucide="check-circle" className="shrink-0 mt-0.5 w-4 h-4"></i> : <i data-lucide="info" className="shrink-0 mt-0.5 w-4 h-4"></i>}
                                        <span>{submitMessage.text}</span>
                                    </div>
                                )}

                                <button
                                    onClick={submitOrder}
                                    disabled={isSubmitting || cart.length === 0}
                                    className={`w-full py-3 rounded-lg font-bold text-lg text-white shadow-md transition-all flex justify-center items-center gap-2 ${isSubmitting || cart.length === 0 ? 'bg-stone-400 cursor-not-allowed' : (currentOrderId ? 'bg-red-600 hover:bg-red-700 active:bg-red-800 active:scale-95' : 'bg-amber-600 hover:bg-amber-700 active:bg-amber-800 active:scale-95')}`}
                                >
                                    {isSubmitting ? '處理中...' : (currentOrderId ? '確認修改' : '送出訂單')}
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
